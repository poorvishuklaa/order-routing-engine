spring.datasource.url=jdbc:h2:mem:routing;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.seed.enabled=true
app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing
app.scheduler.enabled=false
spring.ai.anthropic.api-key=not-configured
