spring.application.name=order-routing-engine
server.port=${PORT:8080}

# ---------- Database (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_routing?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Sample data ----------
# Loads facilities, products, inventory, orders and a routing group on first start
app.seed.enabled=true

# ---------- Security ----------
# Change this in production (must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-1234567890}
app.jwt.expiration-minutes=480
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- AI recommendations (Spring AI + Anthropic) ----------
# Set ANTHROPIC_API_KEY in your environment. Without it the app runs, but AI generation is disabled.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.options.model=${AI_MODEL:claude-sonnet-5-5}
spring.ai.anthropic.chat.options.max-tokens=4096
